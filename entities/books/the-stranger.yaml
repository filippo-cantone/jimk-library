- kind: lesson
  strategy: inferring
  title: Inferring with The Stranger
  dek: Illustration-based inferring, using illustrations plus text
  lede: Farmer Bailey hits a man with his truck who has no memory of who he is -- strange things happen
    on the farm while he stays, and autumn never quite arrives until he leaves. Jim's own retelling of
    the full text runs through the Inferring pack.
  routine: illustration-inference
  steps:
  - - Illustrations plus text
    - Illustrations help students infer and enhance meaning -- not just decoration.
  - - Cover
    - What can you infer from the picture of the boy with a plate of beans? (shared prompt structure,
      adapted here to The Stranger's cover)
  - - TC + BK = I
    - Text Clues + Background Knowledge = Inference -- model the equation explicitly before releasing
      students to use it.
  quote: And etched in frost on the farmhouse windows are words that say simply, ‘See you next fall.’
