  title: Inferring with Fireflies!
  dek: One book, five strategies -- inferring is one row of a multi-strategy chart
  lede: 'A boy catches a jar of fireflies, then sets them free before they die. Jim uses this text for
    prior knowledge, questioning, visualising, inferring and determining-importance in one sitting --
    the inferring-specific prompts:'
  routine: multi-strategy-table
  pairs:
  - - The screen door banged behind me as I ran from the house. If someone said, ‘Don't slam it,’ I wasn't
      listening.
    - Why not?
  - - But it was not the same.
    - Why wasn't it the same in his room?
  - - The moonlight and the fireflies swam in my tears, but I could feel myself smiling.
    - Why was he crying and smiling?
  note: Same passage also carries a text-to-inference chart (background knowledge column left for students)
    and a separate 'Reading Like a Writer' craft table (sensory images, simile, repetition, voice) --
    craft content, not shown on this tab; see Also appears in.
